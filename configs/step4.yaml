# Step 4 -- operating-regime experiments (F2/F3/H2/H3) configuration
# Non-invasive: does not modify default.yaml; this file overrides/adds experiment
# parameters. Algorithm parameters follow default.yaml (no tuning).

step4:
  # All experiments use the same seed pairing for comparison; H2/H3 use subsets to control
  # compute cost
  seeds: [42, 7, 123, 2024, 555]
  h2_seeds: [42, 7, 123]
  h3_seed: 42

  # ---- F2: Dense-cluster Fluid test ----
  f2_n: 40
  cluster_radii_m: [500, 1000, 1500, 2000]   # target cluster radius (initial cluster_radius_max ~= this value)

  # ---- F3: Communication-loss test ----
  f3_n: 40
  packet_loss: [0.0, 0.1, 0.3, 0.5, 0.7]

  # ---- H2: Hole operating regime ----
  hole_n: [20, 30, 40]
  hole_diameters_m: [500, 1000, 1500, 2000, 2500]
  hole_positions:                 # hole centers (ROI 10km x 10km)
    center: [5000, 5000]          # ROI center
    boundary: [9000, 5000]        # inside the right boundary of the ROI
    sparse_edge: [1000, 1000]     # corner (sparse-neighbor region after deployment)

  # ---- H3: Hole force-conflict test ----
  h3_n: 40
  h3_diameter_m: 1500             # fixed central-hole diameter
  h3_position: center
  h3_fmax_list: [50, 100, 200, 300, 400, 600]   # only hole_fill.f_max changes

  # ---- Shared ----
  calibrated_k_fluid: 1.9367e+06    # force-calibrated version (old/new force mean ratio 5533, not metric fitting)
  recover_steps: 200              # H2/H3 recovery-phase steps
  recovery_frac: 0.2              # recovery criterion: hole area <= injected area x frac
  max_removed_agents: 4           # max vessels removed when carving the hole
  record_every: 5                 # time-series sampling step
  target_coverage: 0.90
  t50_target: 0.50
  # oscillation criterion (H3): hole area falls by > drop from the peak, then rises by
  # > rise from the valley; each such cycle counts once
  oscillation_drop_thresh: 0.25
  oscillation_rise_thresh: 0.10
